<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevAuthKit SDK Interactive Demo</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(79, 70, 229, 0.2);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }

    .secondary-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
    }

    .danger-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      margin-top: 10px;
    }

    .danger-btn:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.25);
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }

    #message.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    #message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    #message.info {
      display: block;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.3);
      color: #a5b4fc;
    }

    .authenticated-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .token-preview {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      overflow-x: auto;
      margin: 10px 0;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 80px;
    }
  </style>
  <!-- Load DevAuthKit Client SDK -->
  <script src="/client/index.js"></script>
</head>
<body>
  <div class="card">
    <span class="badge">Powered by DevAuthClient SDK</span>
    <h1>Passwordless Login</h1>
    <p class="subtitle">Email OTP &amp; Dual JWT/Session Authentication</p>

    <!-- Step 1: Request OTP -->
    <form id="request-form">
      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" placeholder="developer@company.com" required />
      </div>
      <button type="submit" id="send-btn">Send OTP Code</button>
    </form>

    <!-- Step 2: Verify OTP -->
    <form id="verify-form" style="display: none; margin-top: 16px;">
      <div class="form-group">
        <label for="otp">Enter 6-Digit OTP</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" />
      </div>
      <button type="submit" id="verify-btn">Verify &amp; Sign In</button>
      <button type="button" class="secondary-btn" id="back-btn">← Change Email</button>
    </form>

    <div id="message"></div>

    <!-- Authenticated State -->
    <div id="auth-panel" class="authenticated-box" style="display: none;">
      <h3 style="font-size: 16px; margin-bottom: 6px; color: var(--success);">✅ Authenticated!</h3>
      <p style="font-size: 13px; color: var(--muted);">Stored JWT Token (via SDK):</p>
      <div id="token-box" class="token-preview"></div>

      <button type="button" class="secondary-btn" id="test-profile-btn">Test auth.getProfile()</button>
      <button type="button" class="secondary-btn" id="test-dashboard-btn">Test auth.fetch('/api/dashboard')</button>
      <button type="button" class="danger-btn" id="logout-btn">Log Out via auth.logout()</button>
    </div>
  </div>

  <script>
    // Initialize the DevAuthClient SDK
    const auth = new DevAuthClient({
      apiUrl: window.location.origin
    });

    const requestForm = document.getElementById("request-form");
    const verifyForm = document.getElementById("verify-form");
    const sendBtn = document.getElementById("send-btn");
    const verifyBtn = document.getElementById("verify-btn");
    const backBtn = document.getElementById("back-btn");
    const messageEl = document.getElementById("message");
    const authPanel = document.getElementById("auth-panel");
    const tokenBox = document.getElementById("token-box");
    const testProfileBtn = document.getElementById("test-profile-btn");
    const testDashboardBtn = document.getElementById("test-dashboard-btn");
    const logoutBtn = document.getElementById("logout-btn");

    function showMessage(text, type = "info") {
      messageEl.textContent = text;
      messageEl.className = type;
    }

    // Reactive State listener using the Client SDK
    auth.onAuthStateChanged((user) => {
      if (user) {
        authPanel.style.display = "block";
        requestForm.style.display = "none";
        verifyForm.style.display = "none";
        tokenBox.textContent = auth.getToken();
        showMessage(`Logged in as: ${user.email}`, "success");
      } else {
        authPanel.style.display = "none";
        requestForm.style.display = "block";
        verifyForm.style.display = "none";
      }
    });

    // 1. Request OTP via SDK
    requestForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      sendBtn.disabled = true;
      showMessage("Sending OTP code...", "info");

      try {
        const data = await auth.sendOTP(email);
        showMessage(data.message + (data.devMode ? " (Check terminal console for OTP code!)" : ""), "success");
        requestForm.style.display = "none";
        verifyForm.style.display = "block";
        document.getElementById("otp").focus();
      } catch (err) {
        showMessage(err.message, "error");
      } finally {
        sendBtn.disabled = false;
      }
    };

    // 2. Verify OTP via SDK
    verifyForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();
      verifyBtn.disabled = true;
      showMessage("Verifying code...", "info");

      try {
        await auth.verifyOTP(email, otp);
        showMessage("Successfully authenticated!", "success");
      } catch (err) {
        const attemptsMsg = err.attemptsRemaining !== undefined ? ` (${err.attemptsRemaining} attempts left)` : "";
        showMessage(err.message + attemptsMsg, "error");
      } finally {
        verifyBtn.disabled = false;
      }
    };

    backBtn.onclick = () => {
      verifyForm.style.display = "none";
      requestForm.style.display = "block";
    };

    // 3. Test Profile via SDK
    testProfileBtn.onclick = async () => {
      try {
        const user = await auth.getProfile();
        showMessage(`[Profile OK via SDK] User: ${user.email}`, "success");
      } catch (err) {
        showMessage("Failed to fetch profile: " + err.message, "error");
      }
    };

    // 4. Test Authenticated Fetch via SDK
    testDashboardBtn.onclick = async () => {
      try {
        const res = await auth.fetch("/api/dashboard");
        const data = await res.json();
        showMessage(res.ok ? `[Dashboard API OK via auth.fetch()] ${data.message} (User: ${data.user?.email})` : data.error, res.ok ? "success" : "error");
      } catch (err) {
        showMessage("Failed to fetch dashboard: " + err.message, "error");
      }
    };

    // 5. Logout via SDK
    logoutBtn.onclick = async () => {
      await auth.logout();
      document.getElementById("otp").value = "";
      showMessage("Logged out successfully.", "info");
    };
  </script>
</body>
</html>
